apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: node-class
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  metadataOptions:
    httpTokens: required
    httpPutResponseHopLimit: 2
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: "dev-dp-001-cluster"
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: "dev-dp-001-cluster"
  role: "dev-dp-001-cluster-karpenter-node-role"
  tags:
    Name: eks-node-dev-dp-001-karpenter
