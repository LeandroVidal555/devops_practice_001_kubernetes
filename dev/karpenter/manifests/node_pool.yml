apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: node-pool
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: node-class
      requirements: # instance creation criteria
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["t3","t3a","m7","m7a","c7a","c8a","r8a"]
